name: Build Extension

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git describe

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # --- Rust + WASM (generated on demand if missing) ---
      - name: Check if WASM needs building
        id: wasm-check
        run: |
          if [ -f public/wasm/pocket_tts_bg.wasm ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        if: steps.wasm-check.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + build
        if: steps.wasm-check.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('scripts/build-wasm.sh') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: Install wasm-pack
        if: steps.wasm-check.outputs.needed == 'true'
        run: |
          if ! command -v wasm-pack &>/dev/null; then
            cargo install wasm-pack
          else
            echo "wasm-pack already cached"
          fi

      - name: Build WASM
        if: steps.wasm-check.outputs.needed == 'true'
        run: bash scripts/build-wasm.sh

      # --- Build + Package ---
      - name: Package extension
        id: package
        run: |
          VERSION=$(bash scripts/stamp-version.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          bash scripts/package.sh "pocket-speechify-${VERSION}"

      - name: Run tests
        run: npm test

      # Untagged builds: upload as artifact only
      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: pocket-speechify-${{ steps.package.outputs.version }}
          path: |
            pocket-speechify-${{ steps.package.outputs.version }}.zip
            pocket-speechify-${{ steps.package.outputs.version }}.crx

      # Tagged builds: create GitHub Release with both .zip and .crx
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pocket-speechify-${{ steps.package.outputs.version }}.zip
            pocket-speechify-${{ steps.package.outputs.version }}.crx
          generate_release_notes: true
          draft: false
          prerelease: false
