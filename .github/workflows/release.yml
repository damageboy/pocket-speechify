name: Build Extension

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git describe

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build WASM (if not vendored)
        run: |
          if [ ! -f wasm/pocket_tts_bg.wasm ]; then
            bash scripts/build-wasm.sh
          else
            echo "WASM binary already vendored, skipping build"
          fi

      - name: Verify build
        run: bash scripts/verify-build.sh

      - name: Stamp version & package
        id: package
        run: |
          VERSION=$(bash scripts/stamp-version.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          bash scripts/package.sh "pocket-speechify-${VERSION}.zip"

      # Untagged builds: upload as artifact only
      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: pocket-speechify-${{ steps.package.outputs.version }}
          path: |
            pocket-speechify-${{ steps.package.outputs.version }}.zip
            pocket-speechify-${{ steps.package.outputs.version }}.crx

      # Tagged builds: create GitHub Release with both .zip and .crx
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pocket-speechify-${{ steps.package.outputs.version }}.zip
            pocket-speechify-${{ steps.package.outputs.version }}.crx
          generate_release_notes: true
          draft: false
          prerelease: false
